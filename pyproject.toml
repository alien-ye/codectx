[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "codectx"
version = "0.1.0"
description = "Local symbol retrieval and provenance-aware code context"
requires-python = ">=3.12"
dependencies = ["filelock>=3", "model2vec>=0.4", "tree-sitter>=0.25", "tree-sitter-python>=0.23", "numpy>=1.26", "orjson>=3.10", "pathspec>=0.12"]
[project.optional-dependencies]
java = ["tree-sitter-java>=0.23"]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.2"]
[project.scripts]
codectx = "codectx.cli:main"
[tool.uv]
package = true
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
